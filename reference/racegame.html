      class BasicAIController {
        constructor(vehicle, track, personality = {}) {
          this.vehicle = vehicle;
          this.track = track;
          this.personality = {
            pace: personality.pace ?? 0.82,
            caution: personality.caution ?? 0.82,
            offset: personality.offset ?? 0,
            color: personality.color ?? "#ff5555"
          };
        }

        update(dt, rivals = []) {
          const nearest = this.track.nearest(this.vehicle.position);
          const speed = this.vehicle.velocity.length();
          const lookahead = clamp(440 + speed * 0.58, 440, 1120);
          const target = this.track.sampleAtS(nearest.s + lookahead);
          const laneOffset = this.personality.offset * target.width * 0.18;
          const targetPoint = Vec2.add(target.p, Vec2.scale(target.normal, laneOffset));
          const toTarget = Vec2.sub(targetPoint, this.vehicle.position);
          const f = this.vehicle.forward();
          const r = this.vehicle.right();
          const steerAngle = Math.atan2(Vec2.dot(toTarget, r), Math.max(1, Vec2.dot(toTarget, f)));
          const steer = clamp(steerAngle / (Math.PI * 0.34), -1, 1);

          const nearTurn = this.track.sampleAtS(nearest.s + clamp(920 + speed * 0.22, 820, 1420));
          const bend = Math.abs(Vec2.cross(target.tangent, nearTurn.tangent));
          let throttle = clamp(this.personality.pace - Math.abs(steer) * 0.24 - bend * this.personality.caution * 0.42, 0.36, 1.0);
          if (this.track.surfaceAt(this.vehicle.position).type === "grass") throttle *= 0.72;

          for (const rival of rivals) {
            if (rival === this.vehicle) continue;
            const gap = Vec2.sub(rival.position, this.vehicle.position);
            const ahead = Vec2.dot(gap, f);
            const side = Math.abs(Vec2.dot(gap, r));
            if (ahead > 0 && ahead < 220 && side < 76) throttle *= 0.55;
          }
          return { steer, throttle, brake: 0 };
        }
      }

      function vehicleBox(vehicle) {
        const forward = vehicle.forward();
        const right = vehicle.right();
        const scale = vehicle.visualScale || 0.74;
        // Match the restored F1 silhouette: front/rear wings and tires are wide,
        // but the car is not as long as the previous placeholder box.
        // Local art extents are roughly x +/-52 and y +/-63 before visualScale.
        return {
          c: vehicle.position,
          axes: [right, forward],
          half: [52 * scale + 3, 63 * scale + 3]
        };
      }

      function projectBox(box, axis) {
        const c = Vec2.dot(box.c, axis);
        const r = Math.abs(Vec2.dot(box.axes[0], axis)) * box.half[0] + Math.abs(Vec2.dot(box.axes[1], axis)) * box.half[1];
        return { min: c - r, max: c + r };
      }

      function resolveVehicleCollision(a, b) {
        const boxA = vehicleBox(a);
        const boxB = vehicleBox(b);
        let minOverlap = Infinity;
        let minAxis = null;
        for (const axis of [...boxA.axes, ...boxB.axes]) {
          const pA = projectBox(boxA, axis);
          const pB = projectBox(boxB, axis);
          const overlap = Math.min(pA.max, pB.max) - Math.max(pA.min, pB.min);
          if (overlap <= 0) return false;
          if (overlap < minOverlap) {
            minOverlap = overlap;
            minAxis = axis;
          }
        }
        const delta = Vec2.sub(b.position, a.position);
        if (Vec2.dot(delta, minAxis) < 0) minAxis = Vec2.scale(minAxis, -1);
        const push = Vec2.scale(minAxis, minOverlap * 0.52 + 0.5);
        a.position.add(Vec2.scale(push, -0.5));
        b.position.add(Vec2.scale(push, 0.5));

        const relative = Vec2.sub(b.velocity, a.velocity);
        const closing = Vec2.dot(relative, minAxis);
        if (closing < 0) {
          const impulse = -(1.18) * closing * 0.5;
          const impulseVec = Vec2.scale(minAxis, impulse);
          a.velocity.add(Vec2.scale(impulseVec, -1));
          b.velocity.add(impulseVec);
          a.speed = Vec2.dot(a.velocity, a.forward());
          b.speed = Vec2.dot(b.velocity, b.forward());
          a.yawRate *= 0.72;
          b.yawRate *= 0.72;
        }
        return true;
      }

      class MiniFormulaGame {
        constructor(root, options = {}) {
          this.root = root;
          this.options = options;
          this.root.innerHTML = "";
          this.canvas = document.createElement("canvas");
          this.canvas.className = "mini-formula-canvas";
          this.root.appendChild(this.canvas);
          this.renderer = new Renderer2DWebGL(this.canvas);
          this.controller = new PlayerController(this.canvas);
          this.particles = new ParticleSystem();
          this.tracks = TRACKS.map(def => new BezierTrack(def));
          this.track = this.tracks[0];
          this.currentTrackIndex = 0;
          this.presetColors = ["#2d7ff9", "#e83f4f", "#f8d84a", "#26d07c", "#ff8b2d", "#8f6bff", "#f4f7fb", "#111827"];
          const requestedLivery = String(options.livery || this.presetColors[0]).toLowerCase();
          this.selectedLivery = this.presetColors.includes(requestedLivery) ? requestedLivery : this.presetColors[0];
          this.gridSizeChoices = [5, 10, 20];
          this.gridSize = this.gridSizeChoices.includes(Number(options.gridSize)) ? Number(options.gridSize) : 10;
          this.physicsMode = options.physicsMode === "advanced" ? "advanced" : "basic";
          this.vehicle = new Vehicle(this.track, this.selectedLivery);
          this.camera = new Camera(this.vehicle);
          this.camera.canvas = this.canvas;
          this.camera.position = this.vehicle.position;
          this.state = "menu";
          this.lap = 1;
          this.totalLaps = 3;
          this.raceTime = 0;
          this.bestTime = null;
          this.finishedTime = 0;
          this.lastTimestamp = performance.now();
          this.rng = new RNG(Date.now() & 0xffffffff);
          this.aiEnabled = options.aiDrivers === true;
          this.aiVehicles = [];
          this.aiControllers = [];
          this.aiCount = Math.max(0, this.gridSize - 1);
          this.playerRacePosition = 1;
          this.fieldSize = 1;
          this.playerFinishPosition = 1;
          this.positionHistory = [];
          this.createUi();
          this.renderMenuPreview();
          requestAnimationFrame((time) => this.loop(time));
        }

        createUi() {
          this.menu = document.createElement("div");
          this.menu.className = "mini-panel";
          this.menu.innerHTML = `
            <h1 id="mini-title">Mini Formula</h1>
            <div id="mini-result" class="mini-result mini-hidden"></div>
            <div class="mini-menu-stack">
              <div class="mini-menu-row">
                <span class="mini-menu-label">Color</span>
                <div class="mini-color-row" role="radiogroup" aria-label="Pick car color">
                  ${this.presetColors.map(color => `<button class="mini-color-button" type="button" data-color-choice="${color}" style="--swatch:${color}" aria-label="Car color ${color}"></button>`).join("")}
                </div>
              </div>
              <div class="mini-menu-row">
                <span class="mini-menu-label">Mode</span>
                <div class="mini-segmented" role="group" aria-label="Physics mode">
                  <button type="button" data-mode-choice="basic">Basic</button>
                  <button type="button" data-mode-choice="advanced">Advanced</button>
                </div>
              </div>
              <div class="mini-menu-row">
                <span class="mini-menu-label">Grid</span>
                <div class="mini-segmented mini-grid-segmented" role="group" aria-label="Race grid size">
                  <button type="button" data-grid-size="5">5</button>
                  <button type="button" data-grid-size="10">10</button>
                  <button type="button" data-grid-size="20">20</button>
                </div>
              </div>
              <div class="mini-start-actions">
                <button class="mini-start-button" id="mini-time-trial" type="button">Time Trial</button>
                <button class="mini-start-button primary" id="mini-race" type="button">Race</button>
              </div>
            </div>
          `;
          this.root.appendChild(this.menu);
          this.menuTitle = this.menu.querySelector("#mini-title");
          this.menuResult = this.menu.querySelector("#mini-result");
          this.colorButtons = [...this.menu.querySelectorAll("[data-color-choice]")];
          this.modeChoiceButtons = [...this.menu.querySelectorAll("[data-mode-choice]")];
          this.gridSizeButtons = [...this.menu.querySelectorAll("[data-grid-size]")];
          this.syncMenuColorButtons = () => {
            for (const button of this.colorButtons) {
              button.classList.toggle("is-active", button.dataset.colorChoice === this.selectedLivery);
              button.setAttribute("aria-checked", button.dataset.colorChoice === this.selectedLivery ? "true" : "false");
            }
          };
          this.syncMenuModeButtons = () => {
            for (const button of this.modeChoiceButtons) {
              button.classList.toggle("is-active", button.dataset.modeChoice === this.physicsMode);
            }
          };
          this.syncGridSizeButtons = () => {
            for (const button of this.gridSizeButtons) {
              button.classList.toggle("is-active", Number(button.dataset.gridSize) === this.gridSize);
            }
          };
          this.syncMenuColorButtons();
          this.syncMenuModeButtons();
          this.syncGridSizeButtons();
          this.menu.querySelector("#mini-time-trial").addEventListener("click", () => this.startCountdown(false));
          this.menu.querySelector("#mini-race").addEventListener("click", () => this.startCountdown(true));
          for (const button of this.colorButtons) {
            button.addEventListener("click", () => {
              this.selectedLivery = button.dataset.colorChoice;
              this.vehicle.livery = this.selectedLivery;
              this.syncMenuColorButtons();
            });
          }
          for (const button of this.modeChoiceButtons) {
            button.addEventListener("click", () => {
              this.physicsMode = button.dataset.modeChoice === "advanced" ? "advanced" : "basic";
              this.syncMenuModeButtons();
              this.updateHud();
            });
          }
          for (const button of this.gridSizeButtons) {
            button.addEventListener("click", () => {
              this.gridSize = Number(button.dataset.gridSize);
              this.aiCount = Math.max(0, this.gridSize - 1);
              this.syncGridSizeButtons();
              this.updateHud();
            });
          }

          this.hud = document.createElement("div");
          this.hud.className = "mini-hud mini-hidden";
          this.hud.innerHTML = `
            <div class="mini-status">
              <div class="hud-item hud-track"><span>Track</span><strong data-hud="track">-</strong></div>
              <div class="hud-item hud-lap"><span>Lap</span><strong data-hud="lap">1/3</strong></div>
              <div class="hud-item hud-pos"><span>Pos</span><strong data-hud="pos">P1/1</strong></div>
              <div class="hud-item hud-time"><span>Time</span><strong data-hud="time">0:00.00</strong></div>
              <div class="hud-item hud-speed"><span>Speed</span><strong data-hud="speed">0 km/h</strong></div>
              <div class="hud-item hud-tires"><span>Tires</span><strong data-hud="tires">64°</strong></div>
              <div class="hud-item hud-ai"><span>Grid</span><strong data-hud="ai">1</strong></div>
            </div>
            <div class="mini-hud-actions">
              <button class="mini-small-button" id="mini-mode-toggle" type="button">Basic</button>
              <button class="mini-small-button" id="mini-reset" type="button">Reset</button>
              <button class="mini-small-button mini-quit-button" id="mini-quit" type="button">Quit</button>
            </div>
          `;
          this.root.appendChild(this.hud);
          this.modeButton = this.hud.querySelector("#mini-mode-toggle");
          this.resetButton = this.hud.querySelector("#mini-reset");
          this.quitButton = this.hud.querySelector("#mini-quit");
          this.modeButton.addEventListener("click", () => {
            this.physicsMode = this.physicsMode === "basic" ? "advanced" : "basic";
            if (this.syncMenuModeButtons) this.syncMenuModeButtons();
            this.updateHud();
          });
          this.resetButton.addEventListener("click", () => this.resetCurrentRace());
          this.quitButton.addEventListener("click", () => this.quitToMenu());

          this.countdown = document.createElement("div");
          this.countdown.className = "mini-countdown";
          this.countdown.innerHTML = Array.from({ length: 5 }, () => `<span class="mini-light"></span>`).join("");
          this.root.appendChild(this.countdown);
        }

        setupAiGrid() {
          this.aiVehicles = [];
          this.aiControllers = [];
          if (!this.aiEnabled) return;
          this.aiCount = Math.max(0, this.gridSize - 1);
          const colors = this.presetColors.filter(color => color !== this.selectedLivery);
          const fallbackColors = colors.length ? colors : this.presetColors;
          for (let i = 0; i < this.aiCount; i++) {
            const color = fallbackColors[i % fallbackColors.length];
            const ai = new Vehicle(this.track, color);
            ai.visualScale = this.vehicle.visualScale;
            ai.resetToGrid(this.track, color, i + 1);
            this.aiVehicles.push(ai);
            this.aiControllers.push(new BasicAIController(ai, this.track, {
              pace: 0.72 + (i % 3) * 0.07,
              caution: 0.76 + (i % 2) * 0.16,
              offset: ((i % 3) - 1) * 0.85
            }));
          }
        }

        resetGrid() {
          this.vehicle.resetToGrid(this.track, this.selectedLivery, 0);
          this.setupAiGrid();
          this.updateStandings();
        }

        startCountdown(aiEnabled = false) {
          const index = this.rng.int(0, this.tracks.length - 1);
          this.currentTrackIndex = index;
          this.track = this.tracks[index];
          this.aiEnabled = aiEnabled === true;
          if (this.menuResult) this.menuResult.classList.add("mini-hidden");
          this.resetGrid();
          this.camera.vehicle = this.vehicle;
          this.lap = 1;
          this.raceTime = 0;
          this.finishedTime = 0;
          this.playerRacePosition = 1;
          this.fieldSize = this.aiEnabled ? this.aiVehicles.length + 1 : 1;
          this.playerFinishPosition = 1;
          this.positionHistory = [];
          this.particles.particles.length = 0;
          this.menu.classList.add("mini-hidden");
          this.hud.classList.remove("mini-hidden");
          this.countdown.style.display = "flex";
          this.state = "countdown";
          this.countdownStart = performance.now();
          this.updateHud();
        }

        resetCurrentRace() {
          this.track = this.tracks[this.currentTrackIndex] || this.track;
          this.resetGrid();
          this.camera.vehicle = this.vehicle;
          this.lap = 1;
          this.raceTime = 0;
          this.finishedTime = 0;
          this.playerRacePosition = 1;
          this.fieldSize = this.aiEnabled ? this.aiVehicles.length + 1 : 1;
          this.playerFinishPosition = 1;
          this.positionHistory = [];
          this.particles.particles.length = 0;
          this.countdown.style.display = "flex";
          this.state = "countdown";
          this.countdownStart = performance.now();
          this.updateHud();
        }

        quitToMenu() {
          this.state = "menu";
          this.countdown.style.display = "none";
          this.hud.classList.add("mini-hidden");
          this.menu.classList.remove("mini-hidden");
          if (this.menuTitle) this.menuTitle.textContent = "Mini Formula";
          if (this.menuResult) {
            this.menuResult.textContent = "";
            this.menuResult.classList.add("mini-hidden");
          }
          this.aiVehicles = [];
          this.aiControllers = [];
          this.playerRacePosition = 1;
          this.fieldSize = 1;
          this.positionHistory = [];
          this.particles.particles.length = 0;
          this.vehicle.resetToGrid(this.track, this.selectedLivery, 0);
        }

        startRace() {
          this.state = "racing";
          this.countdown.style.display = "none";
          this.raceStartTime = performance.now();
        }

        finishRace() {
          this.vehicle.finished = true;
          this.vehicle.finishTime = this.raceTime;
          this.updateStandings();
          this.playerFinishPosition = this.playerRacePosition;
          this.state = "finished";
          this.finishedTime = this.raceTime;
          this.bestTime = this.bestTime === null ? this.finishedTime : Math.min(this.bestTime, this.finishedTime);
          this.hud.classList.add("mini-hidden");
          this.menu.classList.remove("mini-hidden");
          if (this.menuTitle) this.menuTitle.textContent = this.aiEnabled ? `Finished P${this.playerFinishPosition}` : "Time Trial Done";
          const resultText = this.aiEnabled
            ? `${this.track.name}: P${this.playerFinishPosition} of ${this.fieldSize}, ${formatTime(this.finishedTime)}. Best: ${formatTime(this.bestTime)}.`
            : `${this.track.name}: ${formatTime(this.finishedTime)}. Best: ${formatTime(this.bestTime)}.`;
          if (this.menuResult) {
            this.menuResult.textContent = resultText;
            this.menuResult.classList.remove("mini-hidden");
          }
        }

        updateCountdown() {
          const elapsed = (performance.now() - this.countdownStart) / 1000;
          const lit = Math.min(5, Math.floor(elapsed / 0.58) + 1);
          const lights = [...this.countdown.querySelectorAll(".mini-light")];
          lights.forEach((light, i) => light.classList.toggle("on", i < lit && elapsed < 3.55));
          if (elapsed > 3.85) this.startRace();
        }

        updateHud() {
          const tireAverage = Object.values(this.vehicle.tireTemps).reduce((a, b) => a + b, 0) / 4;
          this.hud.querySelector('[data-hud="track"]').textContent = this.track.name;
          this.hud.querySelector('[data-hud="lap"]').textContent = `${this.lap}/${this.totalLaps}`;
          const posHud = this.hud.querySelector('[data-hud="pos"]');
          if (posHud) posHud.textContent = this.aiEnabled ? `P${this.playerRacePosition}/${this.fieldSize}` : "P1/1";
          this.hud.querySelector('[data-hud="time"]').textContent = formatTime(this.raceTime);
          this.hud.querySelector('[data-hud="speed"]').textContent = `${Math.max(0, Math.round(this.vehicle.velocity.length() * 0.21))} km/h`;
          this.hud.querySelector('[data-hud="tires"]').textContent = `${Math.round(tireAverage)}°`;
          const aiHud = this.hud.querySelector('[data-hud="ai"]');
          if (aiHud) aiHud.textContent = this.aiEnabled ? `${this.fieldSize}` : "1";
          if (this.modeButton) this.modeButton.textContent = this.physicsMode === "advanced" ? "Advanced" : "Basic";
        }

        update(dt) {
          this.controller.update(this.canvas.clientWidth, this.canvas.clientHeight, this.vehicle.heading);
          if (this.state === "countdown") {
            this.updateCountdown();
          }
          if (this.state === "racing") {
            this.raceTime += dt;
            this.vehicle.update(dt, this.controller, this.particles, this.physicsMode);
            this.updateAi(dt);
            this.resolveCollisions();
            this.updateRaceProgress();
            this.updateHud();
          } else if (this.state === "menu" || this.state === "finished") {
            this.vehicle.update(dt, { steer: 0.15, throttle: 0.2, brake: 0 }, this.particles, "basic");
          }
          this.particles.update(dt);
        }

        updateAi(dt) {
          if (!this.aiEnabled || this.aiVehicles.length === 0) return;
          const allCars = [this.vehicle, ...this.aiVehicles];
          for (let i = 0; i < this.aiVehicles.length; i++) {
            const ai = this.aiVehicles[i];
            const control = this.aiControllers[i].update(dt, allCars);
            ai.update(dt, control, this.particles, "basic");
          }
        }

        resolveCollisions() {
          const cars = [this.vehicle, ...this.aiVehicles];
          for (let pass = 0; pass < 2; pass++) {
            for (let i = 0; i < cars.length; i++) {
              for (let j = i + 1; j < cars.length; j++) {
                resolveVehicleCollision(cars[i], cars[j]);
              }
            }
          }
        }

        hasCrossedLine(vehicle) {
          const previous = vehicle.prevProgressS;
          const current = vehicle.progressS;
          const length = this.track.length;
          return previous > length * 0.82 && current < length * 0.18 && vehicle.velocity.length() > 60;
        }

        raceProgressOf(vehicle) {
          const length = this.track.length;
          if (vehicle.finished) {
            // Finished cars always rank ahead of active cars; earlier finish wins ties.
            return (this.totalLaps + 1) * length - (vehicle.finishTime || this.raceTime) * 0.001;
          }
          return (vehicle.completedLaps || 0) * length + vehicle.progressS;
        }

        updateStandings() {
          const cars = [this.vehicle, ...this.aiVehicles];
          this.fieldSize = this.aiEnabled ? cars.length : 1;
          if (!this.aiEnabled) {
            this.playerRacePosition = 1;
            this.vehicle.racePosition = 1;
            return;
          }
          const ordered = cars.slice().sort((a, b) => this.raceProgressOf(b) - this.raceProgressOf(a));
          ordered.forEach((car, index) => { car.racePosition = index + 1; });
          this.playerRacePosition = this.vehicle.racePosition || 1;
          this.positionHistory.push({ time: this.raceTime, position: this.playerRacePosition });
          if (this.positionHistory.length > 900) this.positionHistory.splice(0, this.positionHistory.length - 900);
        }

        updateRaceProgress() {
          const cars = [this.vehicle, ...this.aiVehicles];
          for (const car of cars) {
            if (car.finished) continue;
            if (this.hasCrossedLine(car)) {
              car.completedLaps = (car.completedLaps || 0) + 1;
              if (car !== this.vehicle && car.completedLaps >= this.totalLaps) {
                car.finished = true;
                car.finishTime = this.raceTime;
              }
            }
          }
          this.lap = Math.min(this.totalLaps, (this.vehicle.completedLaps || 0) + 1);
          this.updateStandings();
          if (!this.vehicle.finished && (this.vehicle.completedLaps || 0) >= this.totalLaps) {
            this.finishRace();
          }
        }

        renderMenuPreview() {
          this.state = "menu";
        }

        draw() {
          this.renderer.begin();
          this.camera.position = this.vehicle.position;
          this.track.draw(this.renderer, this.camera);
          this.particles.draw(this.renderer, this.camera);
          for (const ai of this.aiVehicles) ai.draw(this.renderer, this.camera);
          this.controller.draw(this.renderer, this.vehicle);
          this.vehicle.draw(this.renderer, this.camera);
          this.renderer.flush();
        }

        loop(timestamp) {
          const rawDt = (timestamp - this.lastTimestamp) / 1000;
          this.lastTimestamp = timestamp;
          const dt = Math.min(rawDt, 1 / 30);
          this.update(dt);
          this.draw();
          requestAnimationFrame((time) => this.loop(time));
        }
      }

      window.MiniFormulaWebGL = {
        mount(target, options = {}) {
          const root = typeof target === "string" ? document.querySelector(target) : target;
          if (!root) throw new Error("MiniFormulaWebGL target was not found.");
          return new MiniFormulaGame(root, options);
        },
        tracks: TRACKS
      };

      const defaultRoot = document.getElementById("mini-formula-root");
      if (defaultRoot) window.MiniFormulaWebGL.mount(defaultRoot);
    })();
  </script>
</body>
</html>
