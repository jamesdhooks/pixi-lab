<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Mini Formula WebGL</title>
  <style>
    :root {
      --panel: rgba(8, 12, 18, 0.78);
      --panel-strong: rgba(8, 12, 18, 0.92);
      --text: #f6f8fb;
      --muted: #b7c0cc;
      --accent: #f6d34c;
      --danger: #e53935;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07100b;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #mini-formula-root {
      position: fixed;
      inset: 0;
      background: #07100b;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .mini-formula-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    .mini-panel {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(440px, calc(100vw - 32px));
      padding: 24px;
      border-radius: 22px;
      background: var(--panel-strong);
      box-shadow: 0 24px 90px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .mini-panel h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 6vw, 52px);
      line-height: 0.95;
      letter-spacing: -0.06em;
    }

    .mini-panel p {
      margin: 0 auto 18px;
      max-width: 34em;
      color: var(--muted);
      line-height: 1.4;
      font-size: 14px;
    }

    .mini-controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin: 18px 0;
      text-align: left;
    }

    .mini-controls label {
      font-size: 13px;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
    }

    .mini-controls input[type="color"] {
      width: 64px;
      height: 42px;
      padding: 2px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
    }

    .mini-button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 13px 22px;
      background: var(--accent);
      color: #141414;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(246, 211, 76, 0.26);
      transition: transform 120ms ease, filter 120ms ease;
    }

    .mini-button:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .mini-button:active { transform: translateY(1px); }

    .mini-hud {
      position: absolute;
      left: 50%;
      top: 12px;
      transform: translateX(-50%);
      display: flex;
      align-items: stretch;
      gap: 8px;
      width: min(1120px, calc(100% - 24px));
      padding: 8px;
      border-radius: 18px;
      background: rgba(10, 16, 23, 0.84);
      border: 1px solid rgba(255,255,255,0.13);
      box-shadow: 0 12px 42px rgba(0,0,0,0.24);
      backdrop-filter: blur(10px);
      pointer-events: auto;
      font-variant-numeric: tabular-nums;
      box-sizing: border-box;
    }

    .mini-status {
      display: grid;
      grid-template-columns: minmax(150px, 1.35fr) 70px 72px 108px 98px 72px 58px;
      align-items: stretch;
      gap: 6px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .hud-item {
      min-width: 0;
      padding: 7px 9px;
      border-radius: 12px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.07);
      overflow: hidden;
    }

    .hud-item span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hud-item strong {
      display: block;
      color: var(--text);
      font-size: 13px;
      line-height: 1.05;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hud-track strong { font-size: 12px; }
    .hud-time strong { min-width: 72px; }
    .hud-speed strong { min-width: 78px; }
    .hud-pos strong { min-width: 48px; }

    .mini-hud-actions {
      display: flex;
      align-items: stretch;
      gap: 6px;
      flex: 0 0 auto;
    }

    .mini-small-button {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 12px;
      padding: 0 11px;
      min-width: 64px;
      background: rgba(255,255,255,0.09);
      color: var(--text);
      font-size: 11px;
      font-weight: 850;
      cursor: pointer;
      white-space: nowrap;
    }

    .mini-quit-button {
      background: rgba(255,255,255,0.04);
      color: #ffd7d7;
      border-color: rgba(255,120,120,0.28);
    }

    .mini-checkbox {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
    }

    .mini-checkbox input {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
    }

    .mini-small-button:hover { background: rgba(255,255,255,0.15); }

    .mini-controls select {
      width: 150px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      padding: 0 10px;
      font-weight: 750;
    }

    .mini-controls select option {
      background: #111821;
      color: var(--text);
    }


    .mini-panel {
      width: min(390px, calc(100vw - 32px));
      padding: 28px;
      border-radius: 28px;
    }

    .mini-panel h1 {
      margin: 0 0 22px;
      font-size: clamp(38px, 9vw, 64px);
      line-height: 0.86;
      letter-spacing: -0.075em;
      text-transform: uppercase;
    }

    .mini-result {
      margin: -10px 0 20px;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 13px;
      line-height: 1.35;
      font-weight: 750;
    }

    .mini-menu-stack {
      display: grid;
      gap: 14px;
    }

    .mini-menu-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px;
      border-radius: 18px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.10);
    }

    .mini-menu-label {
      color: var(--text);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .mini-color-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    .mini-color-button {
      appearance: none;
      width: 34px;
      height: 34px;
      border: 2px solid rgba(255,255,255,0.16);
      border-radius: 999px;
      background: var(--swatch);
      cursor: pointer;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.20), 0 8px 18px rgba(0,0,0,0.16);
      transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
    }

    .mini-color-button.is-active {
      border-color: var(--text);
      transform: scale(1.12);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.24), 0 0 0 4px rgba(255,255,255,0.16), 0 12px 22px rgba(0,0,0,0.22);
    }

    .mini-color-button:hover { transform: scale(1.08); }
    .mini-color-button.is-active:hover { transform: scale(1.12); }

    .mini-segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-width: 190px;
      padding: 3px;
      border-radius: 999px;
      background: rgba(0,0,0,0.34);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .mini-segmented.mini-grid-segmented {
      grid-template-columns: repeat(3, 1fr);
      min-width: 210px;
    }

    .mini-segmented button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, transform 120ms ease;
    }

    .mini-segmented button.is-active {
      background: var(--accent);
      color: #101318;
      box-shadow: 0 8px 20px rgba(246, 211, 76, 0.22);
    }

    .mini-start-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 6px;
    }

    .mini-start-button {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 20px;
      min-height: 64px;
      padding: 16px 12px;
      color: var(--text);
      background: rgba(255,255,255,0.10);
      font-size: 15px;
      font-weight: 950;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: 0 14px 32px rgba(0,0,0,0.20);
      transition: transform 120ms ease, filter 120ms ease, background 120ms ease;
    }

    .mini-start-button.primary {
      background: var(--accent);
      color: #101318;
      border-color: rgba(255,255,255,0.0);
    }

    .mini-start-button:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .mini-start-button:active { transform: translateY(1px); }

    @media (max-width: 480px) {
      .mini-menu-row {
        align-items: stretch;
        flex-direction: column;
        text-align: left;
      }
      .mini-segmented { width: 100%; min-width: 0; }
      .mini-start-actions { grid-template-columns: 1fr; }
    }

    .mini-countdown {
      position: absolute;
      left: 50%;
      top: 12%;
      transform: translateX(-50%);
      display: none;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .mini-light {
      width: clamp(22px, 5vw, 40px);
      height: clamp(22px, 5vw, 40px);
      border-radius: 50%;
      background: #250909;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
      border: 2px solid rgba(255,255,255,0.14);
    }

    .mini-light.on {
      background: var(--danger);
      box-shadow: 0 0 24px rgba(229,57,53,0.95), inset 0 0 10px rgba(255,255,255,0.35);
    }

    .mini-hidden { display: none !important; }

    @media (max-width: 760px) {
      .mini-hud {
        left: 8px;
        right: 8px;
        top: 8px;
        width: auto;
        transform: none;
        align-items: stretch;
      }
      .mini-status {
        grid-template-columns: 1fr 54px 82px 78px;
      }
      .hud-tires, .hud-ai { display: none; }
      .hud-item { padding: 6px 7px; }
      .hud-item span { font-size: 8px; }
      .hud-item strong { font-size: 11px; }
      .mini-hud-actions { flex-wrap: wrap; justify-content: flex-end; }
      .mini-small-button { min-width: 54px; min-height: 32px; padding: 0 8px; }
    }
  </style>
</head>
<body>
  <div id="mini-formula-root"></div>

  <script>
    (() => {
      "use strict";

      const TAU = Math.PI * 2;
      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const invLerp = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
      const smoothstep = (a, b, v) => {
        const t = invLerp(a, b, v);
        return t * t * (3 - 2 * t);
      };
      const hexToRgb = (hex) => {
        const value = hex.replace("#", "");
        return [
          parseInt(value.slice(0, 2), 16) / 255,
          parseInt(value.slice(2, 4), 16) / 255,
          parseInt(value.slice(4, 6), 16) / 255,
          1
        ];
      };
      const rgba = (r, g, b, a = 1) => [r / 255, g / 255, b / 255, a];
      const hash2 = (x, y) => {
        let n = (x * 374761393 + y * 668265263) ^ (x * y * 1274126177);
        n = (n ^ (n >>> 13)) * 1274126177;
        return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
      };
      const hashRange = (x, y, salt, min, max) => lerp(min, max, hash2(x + salt * 101, y - salt * 197));
      const formatTime = (seconds) => {
        const s = Math.max(0, seconds);
        const minutes = Math.floor(s / 60);
        const rem = s - minutes * 60;
        return `${minutes}:${rem.toFixed(2).padStart(5, "0")}`;
      };

      class RNG {
        constructor(seed = 12345) { this.seed = seed >>> 0; }
        next() {
          this.seed = (1664525 * this.seed + 1013904223) >>> 0;
          return this.seed / 4294967296;
        }
        range(min, max) { return lerp(min, max, this.next()); }
        int(min, max) { return Math.floor(this.range(min, max + 1)); }
      }

      class Vec2 {
        constructor(x = 0, y = 0) { this.x = x; this.y = y; }
        clone() { return new Vec2(this.x, this.y); }
        set(x, y) { this.x = x; this.y = y; return this; }
        add(v) { this.x += v.x; this.y += v.y; return this; }
        sub(v) { this.x -= v.x; this.y -= v.y; return this; }
        scale(s) { this.x *= s; this.y *= s; return this; }
        length() { return Math.hypot(this.x, this.y); }
        normalize() {
          const len = this.length() || 1;
          this.x /= len;
          this.y /= len;
          return this;
        }
        static add(a, b) { return new Vec2(a.x + b.x, a.y + b.y); }
        static sub(a, b) { return new Vec2(a.x - b.x, a.y - b.y); }
        static scale(v, s) { return new Vec2(v.x * s, v.y * s); }
        static dot(a, b) { return a.x * b.x + a.y * b.y; }
        static cross(a, b) { return a.x * b.y - a.y * b.x; }
        static distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
      }

      class Renderer2DWebGL {
        constructor(canvas) {
          this.canvas = canvas;
          this.gl = canvas.getContext("webgl", { antialias: true, alpha: false, powerPreference: "high-performance" });
          if (!this.gl) throw new Error("WebGL is not available in this browser.");
          this.maxVertices = 240000;
          this.positions = new Float32Array(this.maxVertices * 2);
          this.colors = new Float32Array(this.maxVertices * 4);
          this.vertexCount = 0;
          this.program = this.createProgram();
          this.positionBuffer = this.gl.createBuffer();
          this.colorBuffer = this.gl.createBuffer();
          this.positionLocation = this.gl.getAttribLocation(this.program, "a_position");
          this.colorLocation = this.gl.getAttribLocation(this.program, "a_color");
          this.resolutionLocation = this.gl.getUniformLocation(this.program, "u_resolution");
        }

        createProgram() {
          const vertexSource = `
            attribute vec2 a_position;
            attribute vec4 a_color;
            uniform vec2 u_resolution;
            varying vec4 v_color;
            void main() {
              vec2 zeroToOne = a_position / u_resolution;
              vec2 clipSpace = zeroToOne * 2.0 - 1.0;
              gl_Position = vec4(clipSpace * vec2(1.0, -1.0), 0.0, 1.0);
              v_color = a_color;
            }
          `;
          const fragmentSource = `
            precision mediump float;
            varying vec4 v_color;
            void main() {
              gl_FragColor = v_color;
            }
          `;
          const gl = this.gl;
          const compile = (type, source) => {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
              throw new Error(gl.getShaderInfoLog(shader) || "Shader compile failed");
            }
            return shader;
          };
          const program = gl.createProgram();
          gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
          gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program) || "Program link failed");
          }
          return program;
        }

        resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const width = Math.floor(this.canvas.clientWidth * dpr);
          const height = Math.floor(this.canvas.clientHeight * dpr);
          if (this.canvas.width !== width || this.canvas.height !== height) {
            this.canvas.width = width;
            this.canvas.height = height;
          }
          this.dpr = dpr;
          this.gl.viewport(0, 0, width, height);
        }

        begin() {
          this.resize();
          this.vertexCount = 0;
          const gl = this.gl;
          gl.disable(gl.DEPTH_TEST);
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
          gl.clearColor(0.035, 0.08, 0.045, 1);
          gl.clear(gl.COLOR_BUFFER_BIT);
        }

        pushVertex(x, y, color) {
          if (this.vertexCount >= this.maxVertices) this.flush(true);
          const i = this.vertexCount;
          this.positions[i * 2] = x * this.dpr;
          this.positions[i * 2 + 1] = y * this.dpr;
          this.colors[i * 4] = color[0];
          this.colors[i * 4 + 1] = color[1];
          this.colors[i * 4 + 2] = color[2];
          this.colors[i * 4 + 3] = color[3];
          this.vertexCount++;
        }

        triangle(a, b, c, color) {
          this.pushVertex(a.x, a.y, color);
          this.pushVertex(b.x, b.y, color);
          this.pushVertex(c.x, c.y, color);
        }

        quad(a, b, c, d, color) {
          this.triangle(a, b, c, color);
          this.triangle(a, c, d, color);
        }

        rect(x, y, w, h, color) {
          this.quad({ x, y }, { x: x + w, y }, { x: x + w, y: y + h }, { x, y: y + h }, color);
        }

        polygon(points, color) {
          if (points.length < 3) return;
          for (let i = 1; i < points.length - 1; i++) {
            this.triangle(points[0], points[i], points[i + 1], color);
          }
        }

        circle(cx, cy, radius, color, segments = 24) {
          const center = { x: cx, y: cy };
          for (let i = 0; i < segments; i++) {
            const a = i / segments * TAU;
            const b = (i + 1) / segments * TAU;
            this.triangle(
              center,
              { x: cx + Math.cos(a) * radius, y: cy + Math.sin(a) * radius },
              { x: cx + Math.cos(b) * radius, y: cy + Math.sin(b) * radius },
              color
            );
          }
        }

        line(a, b, width, color) {
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const len = Math.hypot(dx, dy) || 1;
          const nx = -dy / len * width * 0.5;
          const ny = dx / len * width * 0.5;
          this.quad(
            { x: a.x + nx, y: a.y + ny },
            { x: b.x + nx, y: b.y + ny },
            { x: b.x - nx, y: b.y - ny },
            { x: a.x - nx, y: a.y - ny },
            color
          );
        }

        flush(keepGoing = false) {
          if (this.vertexCount === 0) return;
          const gl = this.gl;
          gl.useProgram(this.program);
          gl.uniform2f(this.resolutionLocation, this.canvas.width, this.canvas.height);

          gl.bindBuffer(gl.ARRAY_BUFFER, this.positionBuffer);
          gl.bufferData(gl.ARRAY_BUFFER, this.positions.subarray(0, this.vertexCount * 2), gl.DYNAMIC_DRAW);
          gl.enableVertexAttribArray(this.positionLocation);
          gl.vertexAttribPointer(this.positionLocation, 2, gl.FLOAT, false, 0, 0);

          gl.bindBuffer(gl.ARRAY_BUFFER, this.colorBuffer);
          gl.bufferData(gl.ARRAY_BUFFER, this.colors.subarray(0, this.vertexCount * 4), gl.DYNAMIC_DRAW);
          gl.enableVertexAttribArray(this.colorLocation);
          gl.vertexAttribPointer(this.colorLocation, 4, gl.FLOAT, false, 0, 0);

          gl.drawArrays(gl.TRIANGLES, 0, this.vertexCount);
          if (keepGoing) this.vertexCount = 0;
        }
      }

      class CubicBezier {
        constructor(p0, c1, c2, p1) {
          this.p0 = p0;
          this.c1 = c1;
          this.c2 = c2;
          this.p1 = p1;
        }
        at(t) {
          const u = 1 - t;
          const tt = t * t;
          const uu = u * u;
          const uuu = uu * u;
          const ttt = tt * t;
          return new Vec2(
            uuu * this.p0.x + 3 * uu * t * this.c1.x + 3 * u * tt * this.c2.x + ttt * this.p1.x,
            uuu * this.p0.y + 3 * uu * t * this.c1.y + 3 * u * tt * this.c2.y + ttt * this.p1.y
          );
        }
        tangent(t) {
          const u = 1 - t;
          return new Vec2(
            3 * u * u * (this.c1.x - this.p0.x) + 6 * u * t * (this.c2.x - this.c1.x) + 3 * t * t * (this.p1.x - this.c2.x),
            3 * u * u * (this.c1.y - this.p0.y) + 6 * u * t * (this.c2.y - this.c1.y) + 3 * t * t * (this.p1.y - this.c2.y)
          ).normalize();
        }
      }

      class BezierTrack {
        constructor(definition) {
          this.definition = definition;
          this.name = definition.name;
          this.widthKeys = [...definition.widthKeys].sort((a, b) => a.pct - b.pct);
          this.pathScale = definition.pathScale ?? 3.65;
          this.widthScale = definition.widthScale ?? 1.70;
          this.curbs = [];
          this.segments = this.makeClosedBezier(definition.anchors.map(([x, y]) => new Vec2(x * this.pathScale, y * this.pathScale)), definition.tension ?? 0.85);
          this.samples = this.samplePath(definition.samples ?? 900);
          this.length = this.samples[this.samples.length - 1].s;
          this.addSampleDetails();
          this.curbs = this.buildCurbs();
        }

        makeClosedBezier(points, tension) {
          const segments = [];
          const n = points.length;
          for (let i = 0; i < n; i++) {
            const p0 = points[i];
            const p1 = points[(i + 1) % n];
            const prev = points[(i - 1 + n) % n];
            const next = points[(i + 2) % n];
            const c1 = Vec2.add(p0, Vec2.scale(Vec2.sub(p1, prev), tension / 6));
            const c2 = Vec2.sub(p1, Vec2.scale(Vec2.sub(next, p0), tension / 6));
            segments.push(new CubicBezier(p0, c1, c2, p1));
          }
          return segments;
        }

        samplePath(count) {
          const samples = [];
          let previous = this.segments[0].at(0);
          let s = 0;
          for (let i = 0; i <= count; i++) {
            const normalized = i / count;
            const raw = normalized * this.segments.length;
            const segmentIndex = Math.min(this.segments.length - 1, Math.floor(raw));
            const t = raw - segmentIndex;
            const segment = this.segments[segmentIndex];
            const p = segment.at(t);
            if (i > 0) s += Vec2.distance(previous, p);
            const tangent = segment.tangent(t);
            const normal = new Vec2(-tangent.y, tangent.x);
            samples.push({ p, tangent, normal, s, width: 120, curvature: 0, turnSide: 0 });
            previous = p;
          }
          return samples;
        }

        addSampleDetails() {
          for (let i = 0; i < this.samples.length; i++) {
            const pct = (this.samples[i].s / this.length) * 100;
            this.samples[i].width = this.widthAtPct(pct);
          }
          for (let i = 1; i < this.samples.length - 1; i++) {
            const a = this.samples[i - 1].tangent;
            const b = this.samples[i + 1].tangent;
            const cross = Vec2.cross(a, b);
            const dot = clamp(Vec2.dot(a, b), -1, 1);
            const turn = Math.atan2(cross, dot);
            const ds = Math.max(1, this.samples[i + 1].s - this.samples[i - 1].s);
            this.samples[i].curvature = turn / ds;
            this.samples[i].turnSide = Math.sign(cross);
          }
        }

        widthAtPct(pct) {
          const keys = this.widthKeys;
          const scaled = (width) => width * this.widthScale;
          if (pct <= keys[0].pct) return scaled(keys[0].width);
          for (let i = 0; i < keys.length - 1; i++) {
            const a = keys[i];
            const b = keys[i + 1];
            if (pct >= a.pct && pct <= b.pct) return scaled(lerp(a.width, b.width, invLerp(a.pct, b.pct, pct)));
          }
          return scaled(keys[keys.length - 1].width);
        }

        buildCurbs() {
          const groups = [];
          const minCurvature = 0.00047;
          let active = null;
          for (let i = 4; i < this.samples.length - 4; i++) {
            const sample = this.samples[i];
            const side = sample.turnSide;
            const isTurn = Math.abs(sample.curvature) > minCurvature && side !== 0;
            if (isTurn) {
              if (!active || active.side !== side) {
                if (active && this.samples[active.end].s - this.samples[active.start].s > 150) groups.push(active);
                active = { start: i, end: i, side, maxIndex: i, maxCurv: Math.abs(sample.curvature) };
              } else {
                active.end = i;
                if (Math.abs(sample.curvature) > active.maxCurv) {
                  active.maxCurv = Math.abs(sample.curvature);
                  active.maxIndex = i;
                }
              }
            } else if (active) {
              if (this.samples[active.end].s - this.samples[active.start].s > 150) groups.push(active);
              active = null;
            }
          }
          if (active && this.samples[active.end].s - this.samples[active.start].s > 150) groups.push(active);

          const curbs = [];
          const maxIndex = this.samples.length - 2;
          const minCurbLength = 420;
          const minExitLength = 300;
          const expandToLength = (startIndex, endIndex, desiredLength) => {
            let start = clamp(Math.floor(startIndex), 1, maxIndex);
            let end = clamp(Math.floor(endIndex), 1, maxIndex);
            if (end < start) [start, end] = [end, start];
            while (end < maxIndex && this.samples[end].s - this.samples[start].s < desiredLength) end++;
            while (start > 1 && this.samples[end].s - this.samples[start].s < desiredLength) start--;
            return { start, end, length: this.samples[end].s - this.samples[start].s };
          };

          for (const group of groups) {
            const span = group.end - group.start;
            const groupLength = this.samples[group.end].s - this.samples[group.start].s;
            if (groupLength < minExitLength) continue;
            const pad = Math.max(18, Math.floor(span * 0.26));
            const apex = expandToLength(group.start - Math.floor(span * 0.08), group.end + Math.floor(span * 0.10), minCurbLength);
            if (apex.length >= minCurbLength * 0.9) {
              curbs.push({ startIndex: apex.start, endIndex: apex.end, side: group.side, kind: "apex" });
            }
            const exit = expandToLength(group.maxIndex + Math.floor(span * 0.08), group.end + pad, minExitLength);
            if (exit.length >= minExitLength * 0.9) {
              curbs.push({ startIndex: exit.start, endIndex: exit.end, side: -group.side, kind: "exit" });
            }
          }
          return curbs;
        }

        nearest(point) {
          let bestIndex = 0;
          let bestD2 = Infinity;
          for (let i = 0; i < this.samples.length; i += 3) {
            const sample = this.samples[i];
            const dx = point.x - sample.p.x;
            const dy = point.y - sample.p.y;
            const d2 = dx * dx + dy * dy;
            if (d2 < bestD2) {
              bestD2 = d2;
              bestIndex = i;
            }
          }
          const start = Math.max(0, bestIndex - 4);
          const end = Math.min(this.samples.length - 1, bestIndex + 4);
          for (let i = start; i <= end; i++) {
            const sample = this.samples[i];
            const dx = point.x - sample.p.x;
            const dy = point.y - sample.p.y;
            const d2 = dx * dx + dy * dy;
            if (d2 < bestD2) {
              bestD2 = d2;
              bestIndex = i;
            }
          }
          const sample = this.samples[bestIndex];
          const offset = Vec2.sub(point, sample.p);
          const lateral = Vec2.dot(offset, sample.normal);
          return { sample, index: bestIndex, distance: Math.sqrt(bestD2), lateral, s: sample.s };
        }

        sampleAtS(distance) {
          const length = this.length || 1;
          let s = ((distance % length) + length) % length;
          let lo = 0;
          let hi = this.samples.length - 1;
          while (lo < hi) {
            const mid = (lo + hi) >> 1;
            if (this.samples[mid].s < s) lo = mid + 1;
            else hi = mid;
          }
          const b = this.samples[lo];
          const a = this.samples[(lo - 1 + this.samples.length) % this.samples.length];
          const span = Math.max(1, b.s - a.s);
          const t = clamp((s - a.s) / span, 0, 1);
          return {
            p: new Vec2(lerp(a.p.x, b.p.x, t), lerp(a.p.y, b.p.y, t)),
            tangent: new Vec2(lerp(a.tangent.x, b.tangent.x, t), lerp(a.tangent.y, b.tangent.y, t)).normalize(),
            normal: new Vec2(lerp(a.normal.x, b.normal.x, t), lerp(a.normal.y, b.normal.y, t)).normalize(),
            width: lerp(a.width, b.width, t),
            s
          };
        }

        surfaceAt(point) {
          const nearest = this.nearest(point);
          const halfWidth = nearest.sample.width * 0.5;
          const absLat = Math.abs(nearest.lateral);
          if (absLat <= halfWidth) {
            return { type: "tarmac", grip: 1.02, nearest };
          }
          const curbWidth = 24;
          for (const curb of this.curbs) {
            if (nearest.index >= curb.startIndex && nearest.index <= curb.endIndex) {
              const side = Math.sign(nearest.lateral);
              if (side === curb.side && absLat <= halfWidth + curbWidth) {
                return { type: "curb", grip: 0.88, nearest };
              }
            }
          }
          return { type: "grass", grip: 0.48, nearest };
        }

        draw(renderer, camera) {
          const colors = {
            grassA: rgba(19, 92, 42, 1),
            grassB: rgba(35, 128, 58, 0.34),
            grassC: rgba(10, 68, 32, 0.26),
            grassD: rgba(86, 154, 70, 0.24),
            tarmac: rgba(45, 48, 51, 1),
            tarmacNoise: rgba(62, 64, 66, 0.16),
            edge: rgba(250, 250, 246, 0.96),
            red: rgba(202, 25, 35, 1),
            white: rgba(245, 245, 240, 1),
            startBlack: rgba(18, 18, 18, 1)
          };
          const w = renderer.canvas.clientWidth;
          const h = renderer.canvas.clientHeight;
          renderer.rect(0, 0, w, h, colors.grassA);

          this.drawGrassBands(renderer, camera, colors);

          for (let i = 0; i < this.samples.length - 1; i++) {
            const a = this.samples[i];
            const b = this.samples[i + 1];
            const aL = camera.worldToScreen(Vec2.add(a.p, Vec2.scale(a.normal, a.width * 0.5)));
            const aR = camera.worldToScreen(Vec2.add(a.p, Vec2.scale(a.normal, -a.width * 0.5)));
            const bL = camera.worldToScreen(Vec2.add(b.p, Vec2.scale(b.normal, b.width * 0.5)));
            const bR = camera.worldToScreen(Vec2.add(b.p, Vec2.scale(b.normal, -b.width * 0.5)));
            renderer.quad(aL, bL, bR, aR, colors.tarmac);
          }

          this.drawAsphaltFlecks(renderer, camera, colors.tarmacNoise);
          this.drawCurbs(renderer, camera, colors);
          this.drawRoadEdges(renderer, camera, colors.edge);
          this.drawStartLine(renderer, camera, colors);
        }

        drawGrassBands(renderer, camera, colors) {
          const cameraWorld = camera.position;
          const viewHalfW = renderer.canvas.clientWidth / Math.max(camera.zoom, 0.001) * 0.58 + 360;
          const viewHalfH = renderer.canvas.clientHeight / Math.max(camera.zoom, 0.001) * 0.58 + 360;

          const stripeSpacing = 155;
          const x0 = Math.floor((cameraWorld.x - viewHalfW) / stripeSpacing) * stripeSpacing;
          const x1 = cameraWorld.x + viewHalfW;
          const y0 = cameraWorld.y - viewHalfH;
          const y1 = cameraWorld.y + viewHalfH;
          for (let x = x0; x < x1; x += stripeSpacing) {
            const lean = hashRange(Math.floor(x / stripeSpacing), 0, 44, -0.55, 0.55);
            const a = camera.worldToScreen(new Vec2(x, y0));
            const b = camera.worldToScreen(new Vec2(x + stripeSpacing * lean, y1));
            renderer.line(a, b, 26, colors.grassB);
            const c = camera.worldToScreen(new Vec2(x + stripeSpacing * 0.45, y0));
            const d = camera.worldToScreen(new Vec2(x + stripeSpacing * (0.45 + lean), y1));
            renderer.line(c, d, 14, colors.grassC);
          }

          const cell = 110;
          const gx0 = Math.floor((cameraWorld.x - viewHalfW) / cell);
          const gx1 = Math.ceil((cameraWorld.x + viewHalfW) / cell);
          const gy0 = Math.floor((cameraWorld.y - viewHalfH) / cell);
          const gy1 = Math.ceil((cameraWorld.y + viewHalfH) / cell);
          for (let gx = gx0; gx <= gx1; gx++) {
            for (let gy = gy0; gy <= gy1; gy++) {
              const worldX = gx * cell + hashRange(gx, gy, 1, 8, cell - 8);
              const worldY = gy * cell + hashRange(gx, gy, 2, 8, cell - 8);
              const screen = camera.worldToScreen(new Vec2(worldX, worldY));
              const patch = hashRange(gx, gy, 3, 7, 22) * camera.zoom;
              renderer.circle(screen.x, screen.y, patch, hash2(gx, gy) > 0.52 ? colors.grassB : colors.grassC, 7);
              const bladeCount = hash2(gx, gy + 17) > 0.52 ? 4 : 2;
              for (let k = 0; k < bladeCount; k++) {
                const bx = worldX + hashRange(gx, gy, 4 + k, -44, 44);
                const by = worldY + hashRange(gx, gy, 8 + k, -44, 44);
                const len = hashRange(gx, gy, 12 + k, 16, 42);
                const tilt = hashRange(gx, gy, 16 + k, -0.85, 0.85);
                const a = camera.worldToScreen(new Vec2(bx, by));
                const b = camera.worldToScreen(new Vec2(bx + Math.sin(tilt) * len, by + Math.cos(tilt) * len));
                renderer.line(a, b, hashRange(gx, gy, 30 + k, 0.8, 1.9), k % 2 ? colors.grassD : rgba(64, 138, 62, 0.25));
              }
            }
          }
        }

        drawAsphaltFlecks(renderer, camera, color) {
          const cameraWorld = camera.position;
          const cell = 170;
          const viewHalfW = renderer.canvas.clientWidth / Math.max(camera.zoom, 0.001) * 0.55 + 220;
          const viewHalfH = renderer.canvas.clientHeight / Math.max(camera.zoom, 0.001) * 0.55 + 220;
          const gx0 = Math.floor((cameraWorld.x - viewHalfW) / cell);
          const gx1 = Math.ceil((cameraWorld.x + viewHalfW) / cell);
          const gy0 = Math.floor((cameraWorld.y - viewHalfH) / cell);
          const gy1 = Math.ceil((cameraWorld.y + viewHalfH) / cell);
          for (let gx = gx0; gx <= gx1; gx++) {
            for (let gy = gy0; gy <= gy1; gy++) {
              const world = new Vec2(gx * cell + hashRange(gx, gy, 21, 0, cell), gy * cell + hashRange(gx, gy, 22, 0, cell));
              if (this.surfaceAt(world).type !== "tarmac") continue;
              const a = camera.worldToScreen(world);
              const b = camera.worldToScreen(Vec2.add(world, new Vec2(hashRange(gx, gy, 23, -20, 20), hashRange(gx, gy, 24, -20, 20))));
              renderer.line(a, b, 1.5, color);
            }
          }
        }

        drawCurbs(renderer, camera, colors) {
          const curbWidth = 24;
          const stripeMeters = 66;
          for (const curb of this.curbs) {
            const span = Math.max(1, curb.endIndex - curb.startIndex);
            for (let i = curb.startIndex; i < curb.endIndex; i++) {
              const a = this.samples[i];
              const b = this.samples[i + 1];
              const side = curb.side;
              const t0 = (i - curb.startIndex) / span;
              const t1 = (i + 1 - curb.startIndex) / span;
              const taper0 = Math.min(smoothstep(0.0, 0.18, t0), 1 - smoothstep(0.82, 1.0, t0));
              const taper1 = Math.min(smoothstep(0.0, 0.18, t1), 1 - smoothstep(0.82, 1.0, t1));
              const aInner = Vec2.add(a.p, Vec2.scale(a.normal, side * a.width * 0.5));
              const bInner = Vec2.add(b.p, Vec2.scale(b.normal, side * b.width * 0.5));
              const aOuter = Vec2.add(aInner, Vec2.scale(a.normal, side * curbWidth * Math.max(0, taper0)));
              const bOuter = Vec2.add(bInner, Vec2.scale(b.normal, side * curbWidth * Math.max(0, taper1)));
              const stripeIndex = Math.floor(a.s / stripeMeters);
              renderer.quad(
                camera.worldToScreen(aInner),
                camera.worldToScreen(bInner),
                camera.worldToScreen(bOuter),
                camera.worldToScreen(aOuter),
                stripeIndex % 2 === 0 ? colors.red : colors.white
              );
            }
          }
        }

        drawRoadEdges(renderer, camera, color) {
          const lineWidth = 4.8;
          for (let i = 0; i < this.samples.length - 1; i++) {
            const a = this.samples[i];
            const b = this.samples[i + 1];
            for (const side of [1, -1]) {
              const aOuter = Vec2.add(a.p, Vec2.scale(a.normal, side * a.width * 0.5));
              const bOuter = Vec2.add(b.p, Vec2.scale(b.normal, side * b.width * 0.5));
              const aInner = Vec2.add(aOuter, Vec2.scale(a.normal, -side * lineWidth));
              const bInner = Vec2.add(bOuter, Vec2.scale(b.normal, -side * lineWidth));
              renderer.quad(
                camera.worldToScreen(aOuter),
                camera.worldToScreen(bOuter),
                camera.worldToScreen(bInner),
                camera.worldToScreen(aInner),
                color
              );
            }
          }
        }

        drawStartLine(renderer, camera, colors) {
          const sample = this.samples[0];
          const right = sample.normal;
          const forward = sample.tangent;
          const half = sample.width * 0.5;
          const blockW = sample.width / 8;
          const lineDepth = 22;
          for (let row = 0; row < 2; row++) {
            for (let col = 0; col < 8; col++) {
              const a = Vec2.add(sample.p, Vec2.add(Vec2.scale(right, -half + col * blockW), Vec2.scale(forward, row * lineDepth - lineDepth)));
              const b = Vec2.add(a, Vec2.scale(right, blockW));
              const c = Vec2.add(b, Vec2.scale(forward, lineDepth));
              const d = Vec2.add(a, Vec2.scale(forward, lineDepth));
              renderer.quad(camera.worldToScreen(a), camera.worldToScreen(b), camera.worldToScreen(c), camera.worldToScreen(d), (row + col) % 2 ? colors.white : colors.startBlack);
            }
          }
        }
      }

      class PlayerController {
        constructor(canvas) {
          this.canvas = canvas;
          this.active = false;
          this.pointer = { x: 0, y: 0 };
          this.steer = 0;
          this.throttle = 0;
          this.brake = 0;
          this.radius = 0;
          this.install();
        }

        install() {
          this.canvas.addEventListener("pointerdown", (event) => {
            this.active = true;
            this.canvas.setPointerCapture(event.pointerId);
            this.updatePointer(event);
          });
          this.canvas.addEventListener("pointermove", (event) => {
            if (this.active) this.updatePointer(event);
          });
          const release = () => {
            this.active = false;
            this.throttle = 0;
            this.brake = 0;
            this.steer = 0;
            this.radius = 0;
          };
          this.canvas.addEventListener("pointerup", release);
          this.canvas.addEventListener("pointercancel", release);
          this.canvas.addEventListener("lostpointercapture", release);
          window.addEventListener("blur", release);
        }

        updatePointer(event) {
          const rect = this.canvas.getBoundingClientRect();
          this.pointer.x = event.clientX - rect.left;
          this.pointer.y = event.clientY - rect.top;
        }

        update(width, height, heading = 0) {
          if (!this.active) {
            this.throttle = 0;
            this.brake = 0;
            this.steer = 0;
            this.radius = 0;
            return;
          }
          const cx = width * 0.5;
          const cy = height * 0.5;
          const toPointer = new Vec2(this.pointer.x - cx, cy - this.pointer.y);
          const distance = toPointer.length();
          const carForward = new Vec2(Math.sin(heading), Math.cos(heading));
          const carRight = new Vec2(Math.cos(heading), -Math.sin(heading));
          const forward = Vec2.dot(toPointer, carForward);
          const right = Vec2.dot(toPointer, carRight);
          const angle = Math.atan2(right, Math.max(-1, forward));
          this.steer = clamp(angle / (Math.PI * 0.42), -1, 1);
          this.radius = distance;

          // Throttle-only input: distance from the car maps 0 -> 100% throttle.
          // No commanded brake/reverse; the car naturally slows from drag/engine braking.
          const maxControlRadius = clamp(Math.min(width, height) * 0.27, 160, 270);
          const nearRadius = clamp(Math.min(width, height) * 0.045, 28, 46);
          this.brake = 0;
          this.throttle = smoothstep(nearRadius, maxControlRadius, distance);
        }

        draw(renderer, vehicle) {
          if (!this.active) return;

          const pointer = { x: this.pointer.x, y: this.pointer.y };
          const meterX = pointer.x + 28;
          const meterY = pointer.y;
          const meterHalf = 58;
          const meterTop = { x: meterX, y: meterY - meterHalf };
          const meterBottom = { x: meterX, y: meterY + meterHalf };

          renderer.circle(pointer.x, pointer.y, 8, rgba(255,255,255,0.82), 18);
          renderer.circle(pointer.x, pointer.y, 15, rgba(255,255,255,0.14), 22);
          renderer.line(meterTop, meterBottom, 4, rgba(255, 255, 255, 0.20));

          if (this.throttle > 0.02) {
            renderer.line(
              meterBottom,
              { x: meterX, y: meterBottom.y - (meterHalf * 2) * this.throttle },
              7,
              rgba(72, 220, 112, 0.78)
            );
          }

          const steerLen = 42 * Math.abs(this.steer);
          if (steerLen > 2) {
            const dir = Math.sign(this.steer);
            renderer.line({ x: pointer.x, y: pointer.y + 24 }, { x: pointer.x + steerLen * dir, y: pointer.y + 24 }, 5, rgba(255,255,255,0.38));
          }
        }
      }

      class ParticleSystem {
        constructor() { this.particles = []; }
        emit(position, velocity, color, size, life, count = 1, spread = 0.2) {
          for (let i = 0; i < count; i++) {
            this.particles.push({
              p: position.clone(),
              v: new Vec2(
                velocity.x + (Math.random() - 0.5) * spread * 260,
                velocity.y + (Math.random() - 0.5) * spread * 260
              ),
              color: [...color],
              size: size * (0.65 + Math.random() * 0.7),
              life,
              maxLife: life
            });
          }
        }
        update(dt) {
          for (const particle of this.particles) {
            particle.life -= dt;
            particle.p.add(Vec2.scale(particle.v, dt));
            particle.v.scale(Math.pow(0.08, dt));
          }
          this.particles = this.particles.filter(p => p.life > 0);
        }
        draw(renderer, camera) {
          for (const particle of this.particles) {
            const alpha = clamp(particle.life / particle.maxLife, 0, 1);
            const screen = camera.worldToScreen(particle.p);
            const color = [...particle.color];
            color[3] *= alpha;
            renderer.circle(screen.x, screen.y, particle.size * camera.zoom, color, 12);
          }
        }
      }

      class Vehicle {
        constructor(track, livery = "#2d7ff9") {
          this.track = track;
          this.position = track.samples[0].p.clone();
          const tangent = track.samples[0].tangent;
          this.heading = Math.atan2(tangent.x, tangent.y);
          this.velocity = new Vec2(0, 0);
          this.speed = 0;
          this.yawRate = 0;
          this.steer = 0;
          this.livery = livery;
          this.visualScale = 0.74;
          this.wheelbase = 62;
          this.trackWidth = 34;
          this.length = 76;
          this.tireTemps = { fl: 63, fr: 63, rl: 64, rr: 64 };
          this.slip = 0;
          this.lockup = 0;
          this.wheelSpin = { rl: 0, rr: 0 };
          this.wheelPhase = 0;
          this.lastSurface = "tarmac";
          this.progressS = 0;
          this.prevProgressS = 0;
          this.completedLaps = 0;
          this.finished = false;
          this.finishTime = null;
          this.racePosition = 1;
        }

        reset(track, livery = this.livery) {
          this.track = track;
          this.position = track.samples[0].p.clone();
          const tangent = track.samples[0].tangent;
          this.heading = Math.atan2(tangent.x, tangent.y);
          this.velocity = new Vec2(0, 0);
          this.speed = 0;
          this.yawRate = 0;
          this.steer = 0;
          this.livery = livery;
          this.tireTemps = { fl: 63, fr: 63, rl: 64, rr: 64 };
          this.slip = 0;
          this.lockup = 0;
          this.wheelSpin = { rl: 0, rr: 0 };
          this.wheelPhase = 0;
          this.lastSurface = "tarmac";
          this.progressS = 0;
          this.prevProgressS = 0;
          this.completedLaps = 0;
          this.finished = false;
          this.finishTime = null;
          this.racePosition = 1;
        }

        resetToGrid(track, livery = this.livery, slot = 0) {
          this.track = track;
          const row = Math.floor(slot / 2);
          const col = slot % 2;
          const base = track.sampleAtS(-row * 145 - 24);
          const lateral = slot === 0 ? 0 : (col === 0 ? -1 : 1) * (base.width * 0.20);
          const rearward = -row * 28;
          this.position = Vec2.add(base.p, Vec2.add(Vec2.scale(base.normal, lateral), Vec2.scale(base.tangent, rearward)));
          this.heading = Math.atan2(base.tangent.x, base.tangent.y);
          this.velocity = new Vec2(0, 0);
          this.speed = 0;
          this.yawRate = 0;
          this.steer = 0;
          this.livery = livery;
          this.tireTemps = { fl: 63, fr: 63, rl: 64, rr: 64 };
          this.slip = 0;
          this.lockup = 0;
          this.wheelSpin = { rl: 0, rr: 0 };
          this.wheelPhase = (slot * 0.13) % 1;
          this.lastSurface = "tarmac";
          this.progressS = base.s;
          this.prevProgressS = base.s;
          this.completedLaps = 0;
          this.finished = false;
          this.finishTime = null;
          this.racePosition = slot + 1;
        }

        forward() { return new Vec2(Math.sin(this.heading), Math.cos(this.heading)); }
        right() { return new Vec2(Math.cos(this.heading), -Math.sin(this.heading)); }

        localOffset(x, y) {
          return Vec2.add(Vec2.scale(this.right(), x), Vec2.scale(this.forward(), y));
        }

        wheelPositions() {
          const front = this.wheelbase * 0.46;
          const rear = -this.wheelbase * 0.46;
          const half = this.trackWidth * 0.5;
          const place = (x, y) => Vec2.add(this.position, this.localOffset(x, y));
          return {
            fl: place(-half, front),
            fr: place(half, front),
            rl: place(-half, rear),
            rr: place(half, rear)
          };
        }

        wheelOffsets() {
          const front = this.wheelbase * 0.46;
          const rear = -this.wheelbase * 0.46;
          const half = this.trackWidth * 0.5;
          return {
            fl: this.localOffset(-half, front),
            fr: this.localOffset(half, front),
            rl: this.localOffset(-half, rear),
            rr: this.localOffset(half, rear)
          };
        }

        tempGrip(temp) {
          const coldLoss = clamp((82 - temp) / 34, 0, 1) * 0.26;
          const heatLoss = clamp((temp - 108) / 28, 0, 1) * 0.24;
          return clamp(1.05 - coldLoss - heatLoss, 0.70, 1.08);
        }

        sampleSurfaces() {
          const wheelPositions = this.wheelPositions();
          return {
            fl: this.track.surfaceAt(wheelPositions.fl),
            fr: this.track.surfaceAt(wheelPositions.fr),
            rl: this.track.surfaceAt(wheelPositions.rl),
            rr: this.track.surfaceAt(wheelPositions.rr)
          };
        }

        update(dt, control, particles, mode = "basic") {
          if (mode === "advanced") this.updateAdvanced(dt, control, particles);
          else this.updateBasic(dt, control, particles);
        }

        updateBasic(dt, control, particles) {
          const surfaces = this.sampleSurfaces();
          const grip = {};
          for (const key of Object.keys(surfaces)) grip[key] = surfaces[key].grip * this.tempGrip(this.tireTemps[key]);
          const frontGrip = (grip.fl + grip.fr) * 0.5;
          const rearGrip = (grip.rl + grip.rr) * 0.5;
          const allGrip = (grip.fl + grip.fr + grip.rl + grip.rr) * 0.25;
          this.lastSurface = Object.values(surfaces).some(s => s.type === "grass") ? "grass" : Object.values(surfaces).some(s => s.type === "curb") ? "curb" : "tarmac";

          const targetSteer = control.steer * 0.72;
          this.steer = lerp(this.steer, targetSteer, 1 - Math.exp(-10.5 * dt));
          const aeroDrag = this.speed * Math.abs(this.speed) * 0.00115;
          const rollingDrag = Math.sign(this.speed || 1) * 14;
          const coastDrag = (1 - control.throttle) * Math.sign(this.speed || 1) * (52 + Math.min(240, Math.abs(this.speed) * 0.16));
          const rearDriveGrip = rearGrip * (this.lastSurface === "grass" ? 0.78 : 1);
          const driveAccel = 1580 * control.throttle * rearDriveGrip;
          const grassPenalty = this.lastSurface === "grass" ? 90 : 0;
          this.lockup = 0;
          const accel = driveAccel - aeroDrag - rollingDrag - coastDrag - grassPenalty * Math.sign(this.speed || 1);
          this.speed = clamp(this.speed + accel * dt, 0, 2050);

          const minTurnSpeed = Math.max(0, Math.abs(this.speed) - 14);
          let yawRate = (minTurnSpeed / this.wheelbase) * Math.tan(this.steer) * 0.83;
          const demand = Math.abs(yawRate * this.speed);
          const frontCapacity = 900 * frontGrip;
          const rearCapacity = 845 * rearGrip;
          const understeer = clamp((demand - frontCapacity) / Math.max(1, frontCapacity), 0, 2.0);
          const oversteer = clamp((demand - rearCapacity) / Math.max(1, rearCapacity), 0, 1.6) * clamp(frontGrip - rearGrip + 0.08, 0, 0.7);
          yawRate *= 1 / (1 + understeer * 1.55);
          yawRate += Math.sign(this.steer || yawRate) * oversteer * 0.55;
          this.yawRate = yawRate;
          this.heading += yawRate * dt;
          const forward = this.forward();
          this.velocity = Vec2.scale(forward, this.speed);
          this.position.add(Vec2.scale(this.velocity, dt));
          this.wheelPhase = (this.wheelPhase + Math.abs(this.speed) * dt * 0.024 + Math.max(this.wheelSpin.rl || 0, this.wheelSpin.rr || 0) * dt * 3.5) % 1;
          this.slip = clamp(Math.max(understeer, oversteer, this.lockup), 0, 1.4);
          this.wheelSpin.rl = surfaces.rl.type === "grass" && control.throttle > 0.45 && Math.abs(this.speed) < 170 ? control.throttle * 0.45 : 0;
          this.wheelSpin.rr = surfaces.rr.type === "grass" && control.throttle > 0.45 && Math.abs(this.speed) < 170 ? control.throttle * 0.45 : 0;
          this.updateTires(dt, control, surfaces);
          this.updateProgress();
          this.emitParticles(control, particles, surfaces);
        }

        updateAdvanced(dt, control, particles) {
          const surfaces = this.sampleSurfaces();
          const surfaceList = Object.values(surfaces);
          this.lastSurface = surfaceList.some(s => s.type === "grass") ? "grass" : surfaceList.some(s => s.type === "curb") ? "curb" : "tarmac";

          // Stable rear-drive/front-steer model. It still samples each tire, but it avoids the
          // earlier sign-sensitive per-wheel torque path that could make the car fight itself.
          const frontGrip = ((surfaces.fl.grip * this.tempGrip(this.tireTemps.fl)) + (surfaces.fr.grip * this.tempGrip(this.tireTemps.fr))) * 0.5;
          const rearGrip = ((surfaces.rl.grip * this.tempGrip(this.tireTemps.rl)) + (surfaces.rr.grip * this.tempGrip(this.tireTemps.rr))) * 0.5;
          const leftGrip = ((surfaces.fl.grip * this.tempGrip(this.tireTemps.fl)) + (surfaces.rl.grip * this.tempGrip(this.tireTemps.rl))) * 0.5;
          const rightGrip = ((surfaces.fr.grip * this.tempGrip(this.tireTemps.fr)) + (surfaces.rr.grip * this.tempGrip(this.tireTemps.rr))) * 0.5;

          const targetSteer = control.steer * 0.96;
          this.steer = lerp(this.steer, targetSteer, 1 - Math.exp(-18.5 * dt));

          const f = this.forward();
          const r = this.right();
          let forwardSpeed = Vec2.dot(this.velocity, f);
          let lateralSpeed = Vec2.dot(this.velocity, r);
          const absForward = Math.abs(forwardSpeed);

          this.wheelSpin.rl = 0;
          this.wheelSpin.rr = 0;
          for (const key of ["rl", "rr"]) {
            const surface = surfaces[key];
            const wheelGrip = surface.grip * this.tempGrip(this.tireTemps[key]);
            const desiredWheelSpeed = control.throttle * 1080;
            const speedDifferential = Math.max(0, desiredWheelSpeed - Math.max(0, forwardSpeed));
            const lowSpeedSpin = clamp((260 - absForward) / 260, 0, 1);
            const grassSpin = surface.type === "grass" ? clamp((speedDifferential / 330) * control.throttle * (0.8 + lowSpeedSpin), 0, 1) : 0;
            const tarmacSpin = surface.type === "tarmac" ? clamp((speedDifferential / 820) * Math.max(0, control.throttle - 0.82) * 0.32, 0, 0.25) : 0;
            this.wheelSpin[key] = clamp(grassSpin + tarmacSpin + clamp(0.62 - wheelGrip, 0, 0.22) * control.throttle, 0, 1);
          }

          const rearSpin = Math.max(this.wheelSpin.rl, this.wheelSpin.rr);
          const driveGrip = clamp(rearGrip * (1 - rearSpin * 0.42), 0.25, 1.2);
          const driveAccel = control.throttle * 2140 * driveGrip;
          const aeroDrag = forwardSpeed * Math.abs(forwardSpeed) * 0.00078;
          const rollingDrag = Math.sign(forwardSpeed || 1) * (16 + (this.lastSurface === "grass" ? 18 : 0));
          const engineBrake = (1 - control.throttle) * Math.sign(forwardSpeed || 1) * (84 + absForward * 0.16);
          forwardSpeed += (driveAccel - aeroDrag - rollingDrag - engineBrake) * dt;
          forwardSpeed = clamp(forwardSpeed, -110, 2250);

          // Front tires steer. Low front grip causes understeer; weak rear grip / wheelspin causes oversteer.
          const steerDemand = Math.tan(this.steer);
          const speedFactor = clamp(Math.abs(forwardSpeed) / 720, 0, 1.45);
          const frontCapacity = frontGrip * 1.22;
          const rearCapacity = rearGrip * (1 - rearSpin * 0.32);
          const understeer = clamp((Math.abs(steerDemand) * speedFactor - frontCapacity * 0.72) / Math.max(0.2, frontCapacity), 0, 1.4);
          const oversteer = clamp((frontGrip - rearCapacity + rearSpin * 0.62) * speedFactor, 0, 1.15);
          const turnGrip = clamp(frontGrip * (1 - understeer * 0.38), 0.30, 1.18);
          const targetYaw = (forwardSpeed / this.wheelbase) * steerDemand * 1.22 * turnGrip;
          this.yawRate = lerp(this.yawRate, targetYaw, 1 - Math.exp(-(5.8 + speedFactor * 1.8) * dt));
          this.yawRate += Math.sign(this.steer || this.yawRate || 1) * oversteer * 0.48 * dt;
          this.yawRate += (rightGrip - leftGrip) * control.throttle * 0.20 * dt;
          this.yawRate *= Math.exp(-(1.15 + rearGrip * 1.0) * dt);
          this.yawRate = clamp(this.yawRate, -4.25, 4.25);

          const lateralDamping = (7.8 * frontGrip + 5.2 * rearGrip) * (this.lastSurface === "grass" ? 0.62 : 1);
          const slipFeed = Math.sign(this.steer || 1) * oversteer * absForward * 0.34;
          lateralSpeed += slipFeed * dt;
          lateralSpeed *= Math.exp(-lateralDamping * dt);
          lateralSpeed = clamp(lateralSpeed, -620, 620);

          this.heading += this.yawRate * dt;
          const nf = this.forward();
          const nr = this.right();
          this.velocity = Vec2.add(Vec2.scale(nf, forwardSpeed), Vec2.scale(nr, lateralSpeed));
          const maxSpeed = 2250;
          const v = this.velocity.length();
          if (v > maxSpeed) this.velocity.scale(maxSpeed / v);
          this.position.add(Vec2.scale(this.velocity, dt));
          this.speed = Vec2.dot(this.velocity, this.forward());

          this.wheelPhase = (this.wheelPhase + this.velocity.length() * dt * 0.027 + rearSpin * dt * 5.2) % 1;
          this.lockup = 0;
          this.slip = clamp(Math.max(understeer, oversteer, rearSpin, Math.abs(lateralSpeed) / 520), 0, 1.8);
          this.updateTires(dt, control, surfaces);
          this.updateProgress();
          this.emitParticles(control, particles, surfaces);
        }

        updateTires(dt, control, surfaces) {
          for (const key of Object.keys(this.tireTemps)) {
            const isFront = key === "fl" || key === "fr";
            const surfaceCooling = surfaces[key].type === "grass" ? 7.2 : surfaces[key].type === "curb" ? 3.3 : 2.4;
            const speedAbs = this.velocity.length();
            const steerHeat = isFront ? Math.abs(this.steer) * speedAbs * 0.020 : 0;
            const driveHeat = !isFront ? control.throttle * speedAbs * 0.008 : 0;
            const spinHeat = !isFront ? (this.wheelSpin[key] || 0) * 40 : 0;
            const brakeHeat = control.brake * speedAbs * 0.012;
            const slipHeat = this.slip * speedAbs * 0.023;
            const heat = steerHeat + driveHeat + spinHeat + brakeHeat + slipHeat;
            const cool = (this.tireTemps[key] - 65) * 0.018 + surfaceCooling * 0.03;
            this.tireTemps[key] = clamp(this.tireTemps[key] + (heat - cool) * dt, 45, 132);
          }
        }

        updateProgress() {
          const nearest = this.track.nearest(this.position);
          this.prevProgressS = this.progressS;
          this.progressS = nearest.s;
        }

        emitParticles(control, particles, surfaces) {
          if (!particles) return;
          const speedAbs = this.velocity.length();
          const f = this.forward();
          const rearCenter = Vec2.add(this.position, Vec2.scale(f, -this.wheelbase * 0.55));
          const backwardVelocity = Vec2.scale(f, -Math.max(90, speedAbs) * 0.22);
          const smokeColor = rgba(220, 220, 210, 0.34);
          const rubberColor = rgba(18, 18, 18, 0.38);
          const grassColor = rgba(82, 130, 58, 0.45);
          const surfaceList = Object.values(surfaces);
          const rearSpin = Math.max(this.wheelSpin.rl || 0, this.wheelSpin.rr || 0);
          if (this.lockup > 0.10 && speedAbs > 120) {
            particles.emit(rearCenter, backwardVelocity, smokeColor, 8, 0.68, Math.ceil(this.lockup * 4), 0.7);
          } else if (this.slip > 0.28 && speedAbs > 130) {
            particles.emit(rearCenter, backwardVelocity, rubberColor, 4, 0.48, Math.ceil(this.slip), 0.35);
          }
          if (rearSpin > 0.14) {
            particles.emit(rearCenter, backwardVelocity, surfaces.rl.type === "grass" || surfaces.rr.type === "grass" ? grassColor : smokeColor, 7, 0.56, Math.ceil(rearSpin * 4), 0.8);
          } else if (surfaceList.some(s => s.type === "grass") && speedAbs > 80) {
            particles.emit(rearCenter, backwardVelocity, grassColor, 5, 0.55, 1, 0.55);
          }
        }

        draw(renderer, camera) {
          const center = camera.worldToScreen(this.position);
          const cx = center.x;
          const cy = center.y;
          const z = camera.zoom;
          const livery = hexToRgb(this.livery);
          const dark = rgba(8, 9, 11, 1);
          const carbon = rgba(20, 23, 28, 1);
          const accent = rgba(245, 245, 240, 1);
          const tireHighlight = rgba(225, 230, 232, 0.50);
          const shadow = rgba(0, 0, 0, 0.28);
          const scale = this.visualScale || 0.82;

          // This silhouette uses the older car art coordinate system where negative Y is the nose.
          // Map that into the current fixed-world camera so the nose still points along vehicle.forward().
          const toScreen = (x, y) => camera.worldToScreen(Vec2.add(this.position, this.localOffset(x * scale, -y * scale)));
          const poly = (pts, color) => renderer.polygon(pts.map(([x, y]) => toScreen(x, y)), color);
          const rect = (x, y, w, h, color) => poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], color);
          const circle = (x, y, radius, color, segments = 18) => {
            const p = toScreen(x, y);
            renderer.circle(p.x, p.y, radius * z * scale, color, segments);
          };

          const wheelPoly = (x, y, w, h, extraAngle, phaseOffset = 0) => {
            const c = Math.cos(extraAngle);
            const s = Math.sin(extraAngle);
            const transform = ([px, py]) => [
              x + px * c - py * s,
              y + px * s + py * c
            ];
            const pts = [[-w, -h], [w, -h], [w, h], [-w, h]].map(transform);
            poly(pts, dark);
            const inner = [[-w * 0.42, -h * 0.88], [w * 0.42, -h * 0.88], [w * 0.42, h * 0.88], [-w * 0.42, h * 0.88]].map(transform);
            poly(inner, rgba(42, 45, 50, 1));

            // Subtle rolling highlights. They loop with wheel speed so the tires read as moving.
            const phase = (this.wheelPhase + phaseOffset) % 1;
            for (let i = 0; i < 3; i++) {
              const t = ((phase + i / 3) % 1) * 2 - 1;
              const yy = t * h * 0.78;
              const band = [[-w * 0.56, yy - h * 0.055], [w * 0.56, yy + h * 0.035], [w * 0.56, yy + h * 0.13], [-w * 0.56, yy + h * 0.04]].map(transform);
              poly(band, tireHighlight);
            }
          };

          circle(0, 6, 58, shadow, 28);

          // Tires first so suspension/body sit above them.
          wheelPoly(-31, -24, 6.8, 16, this.steer * 0.55, 0.03);
          wheelPoly(31, -24, 6.8, 16, this.steer * 0.55, 0.19);
          wheelPoly(-33, 32, 7.4, 17, 0, 0.41);
          wheelPoly(33, 32, 7.4, 17, 0, 0.62);

          // Floor, wings and suspension.
          poly([[-22, -30], [22, -30], [28, 42], [15, 58], [-15, 58], [-28, 42]], carbon);
          poly([[-47, -61], [47, -61], [42, -48], [16, -45], [8, -52], [-8, -52], [-16, -45], [-42, -48]], carbon);
          poly([[-42, -55], [-15, -52], [-19, -48], [-45, -50]], livery);
          poly([[42, -55], [15, -52], [19, -48], [45, -50]], livery);
          poly([[-52, 48], [52, 48], [48, 61], [-48, 61]], carbon);
          poly([[-42, 42], [42, 42], [38, 48], [-38, 48]], livery);
          renderer.line(toScreen(-11, -22), toScreen(-31, -28), 2.1 * z * scale, carbon);
          renderer.line(toScreen(11, -22), toScreen(31, -28), 2.1 * z * scale, carbon);
          renderer.line(toScreen(-13, 22), toScreen(-33, 32), 2.1 * z * scale, carbon);
          renderer.line(toScreen(13, 22), toScreen(33, 32), 2.1 * z * scale, carbon);

          // F1-style silhouette: long nose, narrow waist, sidepods, engine cover.
          poly([[0, -63], [7, -44], [6, -20], [12, 1], [10, 29], [0, 57], [-10, 29], [-12, 1], [-6, -20], [-7, -44]], livery);
          poly([[-9, -12], [-29, 3], [-22, 23], [-11, 18]], livery);
          poly([[9, -12], [29, 3], [22, 23], [11, 18]], livery);
          poly([[-5, -50], [5, -50], [4, -4], [0, 14], [-4, -4]], accent);
          poly([[-9, 2], [9, 2], [7, 31], [0, 45], [-7, 31]], rgba(18, 21, 27, 1));

          // Cockpit, halo and roll hoop.
          circle(0, 4, 10, rgba(8, 10, 14, 1), 20);
          circle(0, -1, 6, rgba(35, 40, 48, 1), 18);
          renderer.line(toScreen(-10, -1), toScreen(0, -17), 2.4 * z * scale, carbon);
          renderer.line(toScreen(10, -1), toScreen(0, -17), 2.4 * z * scale, carbon);
          renderer.line(toScreen(-7, 9), toScreen(7, 9), 2.2 * z * scale, carbon);
          circle(0, 23, 4.6, accent, 14);

          // Small livery/definition details.
          poly([[-3, -38], [3, -38], [3, 35], [-3, 35]], rgba(255,255,255,0.34));
          poly([[-24, 8], [-17, 12], [-18, 18], [-26, 16]], accent);
          poly([[24, 8], [17, 12], [18, 18], [26, 16]], accent);
        }
      }

      class Camera {
        constructor(vehicle) {
          this.vehicle = vehicle;
          this.zoom = 0.50;
          this.position = vehicle.position;

        worldToScreen(point) {
          const canvas = this.canvas;
          const cx = canvas.clientWidth * 0.5;
          const cy = canvas.clientHeight * 0.5;
          const dx = point.x - this.vehicle.position.x;
          const dy = point.y - this.vehicle.position.y;
          return { x: cx + dx * this.zoom, y: cy - dy * this.zoom };
        }
      }

      const TRACKS = [
