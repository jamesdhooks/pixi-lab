<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixiJS Particle Explosion</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    #fps {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 6px 10px;
      color: #00ff88;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(0, 255, 136, 0.4);
      border-radius: 4px;
      font-size: 14px;
      font-family: monospace;
      z-index: 10;
      pointer-events: none;
    }

    #hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.75);
      background: rgba(0, 0, 0, 0.45);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      z-index: 10;
      pointer-events: none;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="fps">FPS: 0</div>
  <div id="hint">Click or tap anywhere to spawn particles</div>
  <div id="game"></div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.18.1/dist/pixi.min.js"></script>

  <script>
    (async () => {
      const app = new PIXI.Application();

      await app.init({
        resizeTo: window,
        backgroundColor: 0x111111,
        antialias: true,
        autoDensity: true,
        resolution: Math.min(window.devicePixelRatio || 1, 2)
      });

      document.getElementById("game").appendChild(app.canvas);

      const fpsEl = document.getElementById("fps");
      const particles = [];

      function randomBetween(min, max) {
        return min + Math.random() * (max - min);
      }

      function randomColor() {
        const colors = [
          0xff3b30,
          0xff9500,
          0xffcc00,
          0x34c759,
          0x00c7ff,
          0x5856d6,
          0xff2d55,
          0xffffff
        ];

        return colors[Math.floor(Math.random() * colors.length)];
      }

      function createParticleExplosion(x, y) {
        const particleCount = 70;

        for (let i = 0; i < particleCount; i++) {
          const particle = new PIXI.Graphics();

          const radius = randomBetween(2, 6);
          const color = randomColor();

          particle
            .circle(0, 0, radius)
            .fill(color);

          particle.x = x;
          particle.y = y;

          const angle = Math.random() * Math.PI * 2;
          const speed = randomBetween(2, 9);

          particle.vx = Math.cos(angle) * speed;
          particle.vy = Math.sin(angle) * speed;
          particle.gravity = 0.12;
          particle.friction = 0.975;
          particle.life = randomBetween(45, 90);
          particle.maxLife = particle.life;
          particle.rotationSpeed = randomBetween(-0.2, 0.2);

          app.stage.addChild(particle);
          particles.push(particle);
        }
      }

      app.canvas.addEventListener("pointerdown", (event) => {
        const rect = app.canvas.getBoundingClientRect();

        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        createParticleExplosion(x, y);
      });

      app.ticker.add((ticker) => {
        fpsEl.textContent = `FPS: ${Math.round(app.ticker.FPS)}`;

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];

          p.vx *= p.friction;
          p.vy *= p.friction;
          p.vy += p.gravity;

          p.x += p.vx * ticker.deltaTime;
          p.y += p.vy * ticker.deltaTime;

          p.rotation += p.rotationSpeed * ticker.deltaTime;

          p.life -= ticker.deltaTime;
          p.alpha = Math.max(p.life / p.maxLife, 0);

          const scale = Math.max(p.life / p.maxLife, 0);
          p.scale.set(scale);

          if (p.life <= 0) {
            app.stage.removeChild(p);
            p.destroy();
            particles.splice(i, 1);
          }
        }
      });

      createParticleExplosion(window.innerWidth / 2, window.innerHeight / 2);
    })();
  </script>
</body>
</html>
